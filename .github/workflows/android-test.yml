name: Android UI Tests (Pro Flavor - Manual)

on:
  workflow_dispatch:

jobs:
  test:
    name: Build & Test on Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free Disk Space (Ubuntu)
        run: |
          echo "Disk space before cleanup:"
          df -h
          
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo docker image prune --all --force
                    
          echo "Disk space after cleanup:"
          df -h
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Init Flutter Submodule
        run: |
          git submodule update --init --recursive
          cd submodules/flutter
          git fetch --tags origin stable
          git reset --merge
          git checkout -B stable FETCH_HEAD
          git checkout stable
          git pull origin stable
          ./bin/flutter --version

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create Dummy key.properties
        run: |
          echo "storePassword=dummy" > android/key.properties
          echo "keyPassword=dummy" >> android/key.properties
          echo "keyAlias=dummy" >> android/key.properties
          echo "storeFile=dummy.keystore" >> android/key.properties
          
      - name: Build Flutter APK
        run: |
          ./submodules/flutter/bin/flutter pub get
          ./submodules/flutter/bin/flutter build apk --flavor pro --debug
          
          echo "APK generated at:"
          ls -la $GITHUB_WORKSPACE/build/app/outputs/flutter-apk/app-pro-debug.apk

      - name: Install Appium Environment
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium driver list
          appium &

      - name: Run Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_4
          ram-size: 2048M
          disable-animations: true

          script: >
            cd appium && 
            chmod +x gradlew && 
            ./gradlew clean test 
            -DappPath=$GITHUB_WORKSPACE/build/app/outputs/flutter-apk/app-pro-debug.apk

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports
          path: appium/build/reports/
          retention-days: 5