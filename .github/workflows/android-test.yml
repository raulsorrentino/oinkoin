name: Android UI Tests (Pro Flavor - Manual)

on:
  workflow_dispatch:

jobs:
  test:
    name: Build & Test on Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free Disk Space (Ubuntu)
        run: |
          echo "Disk space before cleanup:"
          df -h
          
          echo "--- Removing .NET & Android NDK ---"
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          
          echo "--- Removing Swap Storage ---"
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          
          echo "--- Removing Large Unused Packages ---"
          sudo apt-get remove -y '^aspnetcore-.*' || true
          sudo apt-get remove -y '^dotnet-.*' || true
          sudo apt-get remove -y '^llvm-.*' || true
          sudo apt-get remove -y 'php.*' || true
          sudo apt-get remove -y azure-cli google-chrome-stable firefox powershell mono-devel || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          
          echo "--- Removing Cache & Docker ---"
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          
          echo "Disk space after cleanup:"
          df -h

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Init Flutter Submodule
        run: |
          git submodule update --init --recursive
          cd submodules/flutter
          git fetch --tags origin stable
          git reset --merge
          git checkout -B stable FETCH_HEAD
          git checkout stable
          git pull origin stable
          ./bin/flutter --version

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Decode Keystore & Configure Signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          echo "storePassword=$ANDROID_STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties
          
      - name: Build Flutter APK
        run: |
          ./submodules/flutter/bin/flutter pub get
          ./submodules/flutter/bin/flutter build apk --flavor pro --release --target-platform android-x64
          
          echo "APK generated at:"
          ls -la $GITHUB_WORKSPACE/build/app/outputs/flutter-apk/app-pro-release.apk

      - name: Install Appium Environment
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium driver list
          appium &

      - name: Run Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_4
          ram-size: 2048M
          disk-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim -camera-back none
          script: >
            cd appium && 
            chmod +x gradlew && 
            ./gradlew clean test -DappPath=$GITHUB_WORKSPACE/build/app/outputs/flutter-apk/app-pro-release.apk || TEST_EXIT_CODE=$?
            echo "Test finished with exit code: ${TEST_EXIT_CODE:-0}"
            
            /usr/local/lib/android/sdk/platform-tools/adb logcat -d > $GITHUB_WORKSPACE/logcat.txt

            if [ ! -z "$TEST_EXIT_CODE" ] && [ "$TEST_EXIT_CODE" -ne 0 ]; then
              exit $TEST_EXIT_CODE
            fi

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            appium/build/reports/
            logcat.txt
          retention-days: 5
