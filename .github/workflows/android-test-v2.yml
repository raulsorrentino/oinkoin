name: Android UI Tests (Pro Flavor - Manual)

on:
  workflow_dispatch:

jobs:
  test:
    name: Build & Test on Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Delete unnecessary tools 🔧
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false # Don't remove Android tools
          tool-cache: true # Remove image tool cache - rm -rf "$AGENT_TOOLSDIRECTORY"
          docker-images: false # Takes 16s, enable if needed in the future
          large-packages: false # includes google-cloud-sdk and it's slow


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Init Flutter Submodule
        run: |
          git submodule update --init --recursive
          cd submodules/flutter
          git fetch --tags origin stable
          git reset --merge
          git checkout -B stable FETCH_HEAD
          git checkout stable
          git pull origin stable
          ./bin/flutter --version

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Decode Keystore & Configure Signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          echo "storePassword=$ANDROID_STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties
          
      - name: Build Flutter APK
        run: |
          ./submodules/flutter/bin/flutter pub get
          ./submodules/flutter/bin/flutter build apk --flavor pro --debug
          
          echo "APK generated at:"
          ls -la $GITHUB_WORKSPACE/build/app/outputs/flutter-apk/app-pro-debug.apk

      - name: Install Appium Environment
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium driver list
          appium &

      - name: Run Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: Nexus 5X
          disk-size: 4096M   
          ram-size: 3072M   
          heap-size: 1024M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -wipe-data
          script: |
            echo "Granting permissions..."
            chmod +x $GITHUB_WORKSPACE/appium/gradlew
            
            echo "Starting Appium test..."
            
            set +e
            
            $GITHUB_WORKSPACE/appium/gradlew -p $GITHUB_WORKSPACE/appium clean test -DappPath=$GITHUB_WORKSPACE/build/app/outputs/flutter-apk/app-pro-debug.apk
            
            TEST_STATUS=$?
            
            set -e
            
            echo "Tests finished. Final Exit code: $TEST_STATUS"
            
            echo "Saving Logcat..."
            /usr/local/lib/android/sdk/platform-tools/adb logcat -d > $GITHUB_WORKSPACE/logcat.txt
            
            if [ $TEST_STATUS -ne 0 ]; then
              echo "Tests Failed."
              exit $TEST_STATUS
            else
              echo "Tests Passed."
              exit 0
            fi

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/
            logcat.txt
          retention-days: 5
