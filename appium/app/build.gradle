plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation("io.appium:java-client:10.0.0")
    testImplementation("org.testng:testng:7.11.0")
    testImplementation("io.cucumber:cucumber-java:7.27.2")
    testImplementation("io.cucumber:cucumber-testng:7.27.2")
    testImplementation("io.cucumber:cucumber-picocontainer:7.27.2")
    testImplementation("org.slf4j:slf4j-simple:2.0.17")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(Test).configureEach {
    useTestNG() {
        suites 'src/test/resources/testng.xml'
    }

    // Pass system properties (like -DappPath) from Gradle CLI to the Java Test JVM
    systemProperties(System.getProperties())

    testLogging {
        events "passed", "skipped", "failed", "standardOut", "standardError"
        showStandardStreams = true
        exceptionFormat "full"
    }
}